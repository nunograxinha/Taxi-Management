<div class="simulacao-container">
  <form [formGroup]="simulacaoForm" (ngSubmit)="calcularCusto()">
    <label for="conforto">Price per minute (€):</label>
      <select formControlName="conforto">
        <option value="">Select</option>
        <option value="Basic">{{ precoStandard }} € (Basic) </option>
        <option value="Luxury">{{ precoLuxo }} € (Luxury)</option>
      </select>
  
    <label for="agravamentoNoturno">Night surcharge (%):</label>
      <input type="number" formControlName="agravamentoNoturno" step="1" min="0">
  
    <label for="inicio">Trip start:</label>
      <input type="datetime-local" formControlName="inicio">
  
    <label for="fim">Trip end:</label>
      <input type="datetime-local" formControlName="fim">
  
    <button type="submit" [disabled]="simulacaoForm.invalid">Calculate cost</button>
  </form>
  
  <div *ngIf="custoTotal !== null">
    <h3>Total trip cost: {{ custoTotal.toFixed(2) }}€</h3>
  </div>

  <div class="btn-container">
    <button class="button" style="font-weight: bold;" routerLink="/manager/manage-prices">Back</button>
  </div>
  
</div>
