<div class="manager-shell" *ngIf="showNavbar">
  <mat-toolbar style="background-color: #FFEB3B; color: #212121;">
    <span class="toolbar-title" routerLink="/manager">Taxi App Manager</span>

    <button mat-icon-button class="home-btn" routerLink="/manager" title="Manager Dashboard">
      <mat-icon>home</mat-icon>
    </button>
  </mat-toolbar>

  <div class="main-content">
    <router-outlet></router-outlet>
  </div>
</div>

<!-- Show content without navbar when on "/" -->
<div *ngIf="!showNavbar">
  <router-outlet></router-outlet>
</div>
