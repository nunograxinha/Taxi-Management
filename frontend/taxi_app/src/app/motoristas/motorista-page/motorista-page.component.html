<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over" disableClose="false">
    <mat-nav-list>
      <a mat-list-item [routerLink]="['/motorista', motorista?.NIF, 'turnos']" (click)="sidenav.close()">
        <mat-icon>local_taxi</mat-icon>
        <span>Manage Shifts</span>
      </a>
      <a mat-list-item [routerLink]="['/motorista', motorista?.NIF, 'pedidos-pendentes']" (click)="sidenav.close()">
        <mat-icon>notifications</mat-icon>
        <span>Pending Requests</span>
        </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar style="background-color: #FFEB3B; color: #212121;">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="toolbar-title">Hello {{ motorista?.name }}</span>

      <button class="logout-btn" routerLink="/motorista">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="main-content">
      <app-ver-turno></app-ver-turno>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
