<div *ngIf="motoristas.length > 0; else noMotoristas">
  <ul>
    <li *ngFor="let motorista of motoristas">
      <div class="display-content">
        <strong>{{ motorista.name }}</strong>
        <span>NIF: {{ motorista.NIF }} - updated on {{ motorista.updatedAt | date:'dd/MM/yyyy' }} at {{ motorista.updatedAt | date:'HH:mm' }}</span>
      </div>
      <button class="icon-button edit" [routerLink]="['/gestor/editar-motorista', motorista.NIF]" title="Edit">
        <span class="material-symbols-outlined">person_edit</span>
      </button>
      <button class="icon-button remove" (click)="removerMotorista(motorista)" title="Remove">
        <span class="material-symbols-outlined">delete</span>
      </button>
    </li>
  </ul>
</div>

<ng-template #noMotoristas>
  <p>No drivers registered.</p>
</ng-template>
