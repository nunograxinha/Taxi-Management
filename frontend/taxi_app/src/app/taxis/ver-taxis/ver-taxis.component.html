<div *ngIf="taxis.length > 0; else vazio">
  <ul>
    <li *ngFor="let taxi of taxis">
      <strong>{{ taxi.licensePlate }}</strong> 
      <span>Model: {{ taxi.brand }} {{ taxi.model }} ({{ taxi.confort }}) -
        updated on {{ taxi.updatedAt | date:'dd/MM/yyyy' }} at {{ taxi.updatedAt | date:'HH:mm' }}
      </span>
      <button class="icon-button edit" [routerLink]="['/gestor/editar-taxi', taxi.licensePlate]" title="Edit">
        <span class="material-symbols-outlined">person_edit</span>
      </button>
      <button class="icon-button remove" (click)="removerTaxi(taxi)" title="Remove">
        <span class="material-symbols-outlined">delete</span>
      </button>
    </li>
  </ul>
</div>

<ng-template #vazio>
  <p>No taxis registered.</p>
</ng-template>
