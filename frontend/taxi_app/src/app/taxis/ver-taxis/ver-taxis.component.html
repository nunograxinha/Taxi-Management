<div class="list-container">
  <div class="filter-bar">
    <div class="search-box">
      <span class="material-icons search-icon">search</span>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Search by plate, brand or model..."
        class="search-input"
      />
    </div>
    <div class="custom-dropdown" [class.open]="comfortMenuOpen">
      <button
        type="button"
        class="dropdown-trigger"
        (click)="toggleComfortMenu($event)"
        [attr.aria-expanded]="comfortMenuOpen"
      >
        <span class="material-icons filter-icon">tune</span>
        <span>{{ selectedComfortLabel }}</span>
        <span class="material-icons chevron-icon">expand_more</span>
      </button>

      <div class="dropdown-menu" *ngIf="comfortMenuOpen">
        <button
          type="button"
          class="dropdown-option"
          *ngFor="let opt of comfortOptions"
          [class.selected]="comfortFilter === opt.value"
          (click)="selectComfort(opt.value)"
        >
          <span>{{ opt.label }}</span>
          <span class="material-icons check-icon" *ngIf="comfortFilter === opt.value">check</span>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="state-msg">Loading taxis...</div>
  <div *ngIf="!isLoading && loadError" class="state-msg error">{{ loadError }}</div>

  <div *ngIf="!isLoading && !loadError && filteredTaxis.length > 0; else emptyState">
    <div class="card-list">
      <div class="item-card" *ngFor="let taxi of filteredTaxis">
        <div class="item-info">
          <div class="item-header">
            <strong class="plate-badge">{{ taxi.licensePlate }}</strong>
            <span class="comfort-pill" [class.luxury]="taxi.confort === 'Luxury'">
              {{ taxi.confort }}
            </span>
          </div>
          <div class="item-meta">
            {{ taxi.brand }} {{ taxi.model }} · Year {{ taxi.purchaseYear }}
            <span *ngIf="taxi.updatedAt">
              · Updated {{ taxi.updatedAt | date:'dd/MM/yyyy HH:mm' }}
            </span>
          </div>
        </div>
        <div class="item-actions">
          <button class="icon-button edit" [routerLink]="['/gestor/editar-taxi', taxi.licensePlate]" title="Edit">
            <span class="material-symbols-outlined">edit</span>
          </button>
          <button class="icon-button remove" (click)="removeTaxi(taxi)" title="Remove">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <p *ngIf="!isLoading && !loadError" class="state-msg">
      {{ taxis.length === 0 ? 'No taxis registered.' : 'No taxis match your search.' }}
    </p>
  </ng-template>
</div>
