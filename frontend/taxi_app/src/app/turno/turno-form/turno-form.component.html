<div class="navbar">
  <span class="navbar-title">Register your shift</span>
</div>
<div class="pagina-form">
  <h1>Shift Registration:</h1>

<form [formGroup]="turnoForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="inicio">Shift Start:</label>
      <input id="inicio" type="datetime-local" formControlName="inicio" />
      <div *ngIf="turnoForm.get('inicio')?.touched && turnoForm.get('inicio')?.invalid">
        <small class="error" *ngIf="turnoForm.get('inicio')?.errors?.['required']">Start time is required.</small>
      </div>
    </div>
  
    <div>
      <label for="fim">Shift End:</label>
      <input id="fim" type="datetime-local" formControlName="fim" />
      <div *ngIf="turnoForm.get('fim')?.touched && turnoForm.get('fim')?.invalid">
        <small class="error" *ngIf="turnoForm.get('fim')?.errors?.['required']">End time is required.</small>
      </div>
    </div>
  
    <div *ngIf="turnoForm.errors && (turnoForm.get('inicio')?.touched || turnoForm.get('fim')?.touched)">
      <small class="error" *ngIf="turnoForm.errors['fimAntesInicio']">End time must be after start time.</small>
      <small class="error" *ngIf="turnoForm.errors['turnoMuitoLongo']">Shift cannot exceed 8 hours.</small>
      <small class="error" *ngIf="turnoForm.errors['inicioFuturo']">Shift start must be after the current time.</small>
    </div>
  
    <div *ngIf="taxisDisponiveis.length > 0">
      <label for="taxi">Select Available Taxi:</label>
      <select id="taxi" formControlName="taxi">
        <option value="" disabled>Choose a taxi</option>
        <option *ngFor="let taxi of taxisDisponiveis" [ngValue]="taxi">
          {{ taxi.brand }} {{ taxi.model }} ({{ taxi.confort }})
        </option>
      </select>
    </div>

    <div *ngIf="turnoForm.get('inicio')?.valid && turnoForm.get('fim')?.valid && !turnoForm.errors && taxisDisponiveis.length <= 0">
      <small class="info">No taxis available during this timeframe.</small>
    </div>
  
    <button type="submit" [disabled]="turnoForm.invalid">Register</button>
  </form>

  <button class="voltar" [routerLink]="['/motorista', motoristaNif, 'turnos']">Back</button>
</div>
