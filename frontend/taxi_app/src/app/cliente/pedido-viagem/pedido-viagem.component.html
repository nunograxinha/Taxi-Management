<!-- Incluindo o CSS do Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<!-- Incluindo o JavaScript do Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Ride Request Form -->
<form *ngIf="clienteData" [formGroup]="form" (ngSubmit)="submeterPedido()">
    <h3>Ride Request Details</h3>
    
    <!-- Client Pickup Location -->
    <div>
        <div class="checkbox-container">
            <input 
                type="checkbox" 
                id="useGeolocation"
                [checked]="useGeolocation" 
                (change)="onGeolocationChange($event)" 
            />
            <label for="useGeolocation">Use current location?</label>
        </div>

        <div *ngIf="useGeolocation">
            <label for="entryAddress">Pickup Address (Obtained automatically): </label>
            <input
                type="text"
                id="entryAddress"
                formControlName="entryAddress"
                readonly
                autocomplete="off"
            />
            <p *ngIf="cidade && rua">Location: {{ cidade }}, {{ rua }}</p>
            <div id="map"></div>
        </div>

        <div *ngIf="!useGeolocation">    
            <label for="codigoPostal">Pickup Address Postal Code:</label>
            <input 
                id="codigoPostal" 
                formControlName="codigoPostal"
                placeholder="Enter pickup postal code (e.g. 1234-567)"
                pattern="\d{4}-\d{3}"
                (blur)="onCodigoPostalChange()"
                autocomplete="off" 

            />
            <div *ngIf="form.get('codigoPostal')?.touched && form.get('codigoPostal')?.invalid">
                <small class="error" *ngIf="form.get('codigoPostal')?.errors?.['pattern']">
                  Invalid postal code. Use format 1234-567.
                </small>
            </div>
            <div *ngIf="cidade && rua">
                <label for="city">City:</label>
                <input id="city" [value]="cidade" readonly placeholder="Filled automatically">
                
                <label for="street">Street:</label>
                <input id="street" [value]="rua.includes(',') ? rua.split(',')[0] : rua" readonly placeholder="Filled automatically">
            </div>
        </div>
    </div>


    <!-- Destination Location -->
    <div>
        <div class="checkbox-container">
            <input 
                type="checkbox" 
                id="useExitGeolocation"
                [checked]="useExitGeolocation" 
                (change)="onExitGeolocationChange($event)"
            />
            <label for="useExitGeolocation">Set Destination Address on Map?</label>
        </div>
        <!-- Geolocation Map -->
        <div *ngIf="useExitGeolocation"> 
            <label for="exitAddress">Destination Address (Click on the map to select): </label>
            <input
                type="text"
                id="exitAddress"
                formControlName="exitAddress"
                readonly
                autocomplete="off"
            />
            <div id="mapExit"></div>
        </div>
        <!-- Manual destination address input -->
        <div *ngIf="!useExitGeolocation" class="manual-address">
            <div>
            <label for="exitCidade">Destination City</label>
            <input 
                id="exitCidade" 
                formControlName="exitCidade" 
                placeholder="Enter destination city"
              />
                <div *ngIf="form.get('exitCidade')?.invalid && form.get('exitCidade')?.touched">
                    <small class="error">Destination city is required.</small>
                </div>
            </div>

            <div>
                <label for="exitRua">Destination Street</label>
                <input 
                    id="exitRua" 
                    formControlName="exitRua" 
                    placeholder="Enter destination street"
                />
                <div *ngIf="form.get('exitRua')?.invalid && form.get('exitRua')?.touched">
                    <small class="error">Destination street is required.</small>
                </div>
            </div>

            <button 
                type="button"
                class="btn btn-seccondary"
                (click)="verificarEndereco()"
                [disabled]="!form.get('exitCidade')?.value || !form.get('exitRua')?.value || loading"
            >
               <span *ngIf="loading">Verifying...</span>
               <span *ngIf="!loading">Verify Address</span>
            </button>
            <!-- Address verification message -->
            <div *ngIf="addressMessage" class="address-message" 
                [ngClass]="{'success': addressVerified, 'error': !addressVerified}">
                {{ addressMessage }}
            </div>

            <!-- Mini map to show verified address -->
            <div *ngIf="addressVerified" class="mini-map-container">
                <div id="miniMap"></div>
            </div>
        </div>
    </div>
  
    <!-- Comfort Level -->
    <div>
      <label for="confort">Comfort Level:</label>
      <select id="confort" formControlName="confort">
        <option value="" disabled hidden>Select Comfort Level</option>
        <option *ngFor="let option of confortOptions" [value]="option">{{ option }}</option>
      </select>
      <div *ngIf="form.get('confort')?.invalid && form.get('confort')?.touched">
        <small class="error">Comfort Level is required.</small>
      </div>
    </div>

    <!-- Number of Passengers -->
    <div>
        <label for="numberOfPeople">Number of Passengers for the Trip</label>
        <input 
            id="numberOfPeople" 
            formControlName="numberOfPeople" 
            type="number"
            min="1"
        />
        <div *ngIf="form.get('numberOfPeople')?.invalid && form.get('numberOfPeople')?.touched">
            <small class="error" *ngIf="form.get('numberOfPeople')?.errors?.['required']">
                Number of passengers is required.
            </small>
            <small class="error" *ngIf="form.get('numberOfPeople')?.errors?.['min']">
                There must be at least 1 passenger.
            </small>
        </div>
    </div> 

    <button type="submit" [disabled]="!form.valid">Submit Request</button>
</form>
