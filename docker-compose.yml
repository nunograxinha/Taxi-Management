services:
  mongodb:
    image: mongo:7
    container_name: taxi-fleet-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxi-fleet-backend
    restart: unless-stopped
    ports:
      - "3073:3073"
    environment:
      - PORT=3073
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/psi}
      - JWT_SECRET=${JWT_SECRET:-taxi-fleet-secret-key-psi-2425}
      - MANAGER_PASSWORD=${MANAGER_PASSWORD:-admin123}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3073/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend/taxi_app
      dockerfile: Dockerfile
    container_name: taxi-fleet-frontend
    restart: unless-stopped
    command: ["npx", "ng", "serve", "--host", "0.0.0.0", "--port", "4200", "--poll", "2000", "--proxy-config", "proxy.conf.json", "--disable-host-check"]
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/taxi_app:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s

volumes:
  mongodb_data:
