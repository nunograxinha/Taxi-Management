
<div class="precario-container">
  <h1 class="titulo precario-header"> Preçário </h1>

  <div class="precos-container">
    <div class="preco-card">
      <h2 class="titulo" style="font-size: 1.4em;">Carro "Básico"</h2>
      <p class="valor-display">{{ custoBase }}€ / min</p>
      <button (click)="alterarValor('custoBase')">Alterar</button>
    </div>
  
    <div class="preco-card">
      <h2 class="titulo"> Carro "Luxo"</h2>
      <p class="valor-display">{{ custoLuxo }}€ / min</p>
      <button (click)="alterarValor('custoLuxo')">Alterar</button>
    </div>
  </div>
  
  <h1 class="titulo taxas-header">Taxas</h1>

  <div class="taxas-container">
    <div class="preco-card">
      <h2 class="titulo">Taxa Noturna (21:00 - 06:00)</h2>
      <p class="valor-display">{{ taxaNocturna }}% / min</p>
      <button (click)="alterarValor('taxaNocturna')">Alterar</button>
    </div>
  </div>
  
  <!-- Popup Modal -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal">
      <h3>Alterar valor de {{ campoAtual }}</h3>
      <div class="input-wrapper">
        <span class="input-prefix">
          {{ campoAtual === 'taxaNocturna' ? '%' : '€' }}
        </span>
        <input type="text" [(ngModel)]="valorTemporario" />
      </div>
      <div class="erro" *ngIf="erroValidacao">{{ erroValidacao }}</div>
      <button (click)="confirmarAlteracao()">Confirmar</button>
      <button (click)="cancelarAlteracao()">Cancelar</button>
    </div>
  </div>
  <div class="btn-container">
    <button style="font-weight: bold;" routerLink="/gestor/gerir-precos/simulacao"> Fazer Simulação </button>
  </div>
