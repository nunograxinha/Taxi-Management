<div class="relatPage">
  <h1>Relatório detalhado</h1>
  <hr>
  <div *ngFor="let item of viagensPorMotorista">
    <div class="motorista-bloco">
      <h3>Motorista: {{ getNomeMotorista(item.motoristaId) }}</h3>
      <table class="motorista">
        <thead>
          <tr>
            <th>Viagem ID</th>
            <th>Distância (Km)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let viagem of item.viagens">
            <td>{{ viagem._id }}</td>
            <td>{{ getKmsArredondado(viagem.distanceKm) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
    <div class="botao-centro">
        <button class="voltar" [routerLink]="['../']">Voltar</button>     
        </div>
    </div>
